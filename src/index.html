<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>eggshells</title>
<meta name="description" content="Wissen, Skills und Selbstfürsorge für Beziehungen mit PTBS/BPD-Dynamik" />
<meta name="theme-color" content="#ece5da" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#15181a" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="eggshells" />
<link rel="preload" href="/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- Ruhige Hintergrund-Landschaft: treibende Farbflächen -->
<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>
<!-- Ostsee-Kopfbild oben auf der Seite, scrollt mit dem Inhalt weg; im Dunkelmodus die Nacht-Version -->
<div class="dune-hero" aria-hidden="true">
  <picture>
    <source srcset="/img/ostsee-nacht.webp" media="(prefers-color-scheme: dark)" />
    <img src="/img/ostsee-tag.webp" alt="" width="2000" height="750" decoding="async" fetchpriority="high" />
  </picture>
</div>
<div id="pin-screen" class="pin-screen hidden">
  <div class="pin-box">
    <h1>eggshells</h1>
    <p>Bitte PIN eingeben</p>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
    <button id="pin-submit">Entsperren</button>
    <p id="pin-error" class="pin-error"></p>
  </div>
</div>
<div id="app" class="hidden"></div>
<script src="/app.js"></script>
</body>
</html>
